[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ftry"
version = "0.1.0"
description = "Minimal mock CLI for ftry commands."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "agent-framework-openai",
    "agent-framework-orchestrations",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = [
    "coverage[toml]>=7.6",
]

[project.scripts]
ftry = "ftry.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
ftry = ["team-type-inference.txt", "ascii-art/*.txt"]

[tool.setuptools.packages.find]
where = ["src"]
