name: HIL Support Routing team

description: |
  A simple support team that routes each request to the right specialist, pauses for one brief user clarification when a routing or resolution detail is missing, then hands off once more to produce the final reply.

termination:
  max-turns: 6

agents:
  - file: ./agent-triage-router.yaml
  - file: ./agent-billing-specialist.yaml
  - file: ./agent-access-specialist.yaml
  - file: ./agent-response-finisher.yaml

prompt: |
  You are orchestrating a simple support workflow based on routing and handoff.

  Available agents:
      {participants}

  Goal:
  Turn one customer support request into one short, ready-to-send answer.

  Handoff flow:
  1. Start with the Triage Router.
  2. The Triage Router reads the request and hands it off to the single best specialist.
  3. The chosen specialist solves the request in scope or writes the key resolution notes.
  4. If one decisive customer detail is still missing for accurate routing or resolution, allow one brief user clarification before the final reply is produced.
  5. When the answer is ready, hand off to the Response Finisher for the final customer-facing reply.

  Rules:
  - This must be a handoff workflow.
  - Use routing and one-way handoff, not a fixed sequential pipeline.
  - Do not run the agents in parallel.
  - Do not start a shared multi-agent discussion.
  - Do not use tools, MCP servers, or external systems.
  - A brief user clarification is allowed only when one missing detail blocks correct routing or a reliable answer.
  - If a specialist receives a request outside its scope, it should hand off back to the Triage Router.
  - The final output must be a concise customer-facing answer.
  - Here is the list of agents with their expertise:
      {roles}
